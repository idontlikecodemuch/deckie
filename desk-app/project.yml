name: Desk
options:
  bundleIdPrefix: io.deckie
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
packages:
  DeckieCore:
    path: ../core
targets:
  Desk:
    type: application
    platform: macOS
    sources:
      - path: Desk/Sources
    dependencies:
      - package: DeckieCore
        product: DeckieBuild
      - package: DeckieCore
        product: DeckieCore
      - package: DeckieCore
        product: DeckieCrate
      - package: DeckieCore
        product: DeckieEngine
      - package: DeckieCore
        product: DeckieInference
      - package: DeckieCore
        product: DeckieDesk
      - package: DeckieCore
        product: DeckieDisc
      - package: DeckieCore
        product: DeckieLookup
      - package: DeckieCore
        product: DeckieCapture
      - sdk: ShazamKit.framework
      - sdk: AVFoundation.framework
    info:
      path: Desk/Info.plist
      properties:
        CFBundleDisplayName: Deckie Desk
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "App Hold Media LLC"
        LSApplicationCategoryType: public.app-category.music
        # The listening mode (Booth.swift) asks for the microphone with these words: DeskWords' booth.micPermission,
        # word for word (BoothTests checks).
        NSMicrophoneUsageDescription: "Deckie Desk listens through the microphone to name the song playing from your crate. Nothing it hears is kept or sent anywhere."
        # The crate file, declared as the booth declares it (deck-app/project.yml), so the Mac shows a crate file as
        # one file of the kind "Deckie crate file", not a plain folder: one extension, .deckie, and the earlier
        # .deckiecrate; a type id for the package form and one for the single-file form; the earlier type ids kept
        # importable. Desk declares no document type: a crate file comes in through Import crate file.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.deckie.crate
            UTTypeDescription: Deckie crate file
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [deckie, deckiecrate]
          - UTTypeIdentifier: io.deckie.crate-file
            UTTypeDescription: Deckie crate file
            UTTypeConformsTo: [public.data, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [deckie, deckiecrate]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: io.christophershannon.deckie.crate
            UTTypeDescription: Deckie crate file
            UTTypeConformsTo: [io.deckie.crate, com.apple.package, public.composite-content]
          - UTTypeIdentifier: io.christophershannon.deckie.crate-file
            UTTypeDescription: Deckie crate file
            UTTypeConformsTo: [io.deckie.crate-file, public.data, public.composite-content]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.deckie.desk
        PRODUCT_NAME: Deckie Desk
        INFOPLIST_KEY_NSHumanReadableCopyright: "App Hold Media LLC"
    postBuildScripts:
      - name: Embed the model runtime and the models
        shell: /bin/sh
        script: |
          set -e
          V="$SRCROOT/Vendor"
          F="$TARGET_BUILD_DIR/$FRAMEWORKS_FOLDER_PATH"
          R="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/models"
          mkdir -p "$F" "$R"
          cp -f "$V/libonnxruntime.1.31.1.dylib" "$F/"
          cp -f "$V/models/beat_this_final0.onnx" "$V/models/yamnet.onnx" "$R/"
          # The learned key reader's file and its credit list, both or neither, when both are in Vendor/models
          # (core/Tools/fetch-key-model.sh --into desk-app/Vendor/models, which checks their hashes; the engine checks
          # the model's again when it loads it). Without them the engine reads keys with the untrained reader.
          # The credit list goes to Contents/Resources/licences, with one sentence saying what it is.
          K="$(sed -n 's/^ *public static let pinnedName = "\([a-z0-9-]*\)"$/\1/p' "$SRCROOT/../core/Sources/DeckieCore/Key/LearnedKey.swift")"
          L="$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/licences"
          rm -f "$R"/deckie-key-* "$L"/deckie-key-*
          if [ -n "$K" ] && [ -f "$V/models/$K.f16" ] && [ -f "$V/models/$K-credits.tsv" ]; then
            mkdir -p "$L"
            cp -f "$V/models/$K.f16" "$R/"
            cp -f "$V/models/$K-credits.tsv" "$L/"
            printf '%s\n' "$K-credits.tsv lists every recording Deckie's key reader learned from, with its title, its page and its licence: the credit those recordings' licences ask for." > "$L/$K-credits-README.txt"
          fi
          codesign --force --sign - "$F/libonnxruntime.1.31.1.dylib"
