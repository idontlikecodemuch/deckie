<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; media-src blob:; connect-src 'none'">
<title>Deckie Desk</title>
<link rel="stylesheet" href="desk.css">
</head>
<body>
<!-- The drawings the pages use, by name. icon-crate is the crate's icon: a box, drawn to match the Mac's (Apple's
     box symbol, CrateIcon in desk-app/Desk/Sources/AddMusic.swift), kept by the owner's choice (Nov 14, 2026); one
     place to swap it in a design pass. icon-drive, icon-disc and icon-folder are the three ways to add music
     (DeskAddMusic.ways). -->
<svg class="defs" aria-hidden="true" focusable="false">
  <symbol id="icon-crate" viewBox="0 0 24 24"><g fill="none" stroke="currentColor"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></g></symbol>
  <symbol id="icon-drive" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><rect x="3" y="7" width="18" height="10" rx="2"/><path d="M7 12.5h4"/><circle cx="17" cy="12" r="1" fill="currentColor"/></g></symbol>
  <symbol id="icon-disc" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></g></symbol>
  <symbol id="icon-folder" viewBox="0 0 24 24"><path d="M3 7.5a1.5 1.5 0 0 1 1.5-1.5h4.4l2 2h8.6a1.5 1.5 0 0 1 1.5 1.5v8a1.5 1.5 0 0 1-1.5 1.5h-15A1.5 1.5 0 0 1 3 17.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></symbol>
</svg>
<!-- Deckie Desk's window on Windows and Linux (D32). No Deckie logic and no words live here: the engine sends what to
     show and the words to show it with (docs/architecture/desk-protocol.md); desk.js draws it. Every element with
     data-w gets the word of that name; data-w-label sets aria-label, data-w-title the tooltip. -->
<header class="bar" role="toolbar" data-w-label="appName">
  <!-- The crate's icon and name, always; a click renames it (research AE). The menu beside it switches crates. -->
  <span class="crate-head">
    <svg class="crate-icon" role="img" data-w-label="crateIcon"><use href="#icon-crate"/></svg>
    <button id="crate-name-button" class="crate-name" data-w-title="renameCrateHelp"><span id="crate-name"></span></button>
  </span>
  <div class="menu-wrap">
    <button id="crate-button" class="crate-button" aria-haspopup="menu" aria-expanded="false" data-w-title="crateMenuHelp" data-w-label="crateMenuHelp"><span class="chev" aria-hidden="true" data-w="glyph.menu"></span></button>
    <ul id="crate-menu" class="menu" role="menu" hidden></ul>
  </div>
  <span class="grow"></span>
  <button id="undo" class="small" disabled></button>
  <button id="redo" class="small" disabled></button>
  <div class="menu-wrap">
    <button id="add-button" aria-haspopup="menu" aria-expanded="false" data-w-title="addMusicHelp"><span id="add-label"></span><span class="chev" aria-hidden="true" data-w="glyph.menu"></span></button>
    <ul id="add-menu" class="menu right" role="menu" hidden></ul>
  </div>
  <button id="sources-button" aria-pressed="false" data-w-title="sourcesHelp" hidden></button>
  <button id="log-button" data-w="whatDidntGoIn" hidden></button>
  <div class="menu-wrap">
    <button id="more-button" aria-haspopup="menu" aria-expanded="false" data-w-label="moreMenu" data-w-title="moreMenu" data-w="glyph.more"></button>
    <ul id="more-menu" class="menu right" role="menu" hidden></ul>
  </div>
  <button id="export-button" class="main" data-w="exportCrateFile" hidden></button>
</header>

<div id="pending" class="banner" role="status" hidden>
  <span class="dot" aria-hidden="true"></span>
  <span id="pending-text"></span>
  <button id="carry-on" class="small" data-w="carryOn"></button>
</div>

<main>
  <!-- The first screen: no crate showing yet. -->
  <section id="first" class="screen center" aria-labelledby="first-title" hidden>
    <svg class="icon crate-big" aria-hidden="true"><use href="#icon-crate"/></svg>
    <h1 id="first-title" data-w="firstTitle"></h1>
    <p id="first-body" class="body"></p>
    <!-- The crate's name, filled in; then the three ways in, the same as everywhere music is added (research AE). -->
    <label class="name-row"><span class="mut" data-w="intoNewCrate"></span> <input id="first-name" type="text" autocomplete="off" spellcheck="false" data-w-label="crateNameLabel"></label>
    <div id="first-ways" class="actions ways"></div>
    <div class="actions">
      <button id="first-import" data-w="importCrateFile"></button>
    </div>
    <p class="dim" data-w="dropHere"></p>
  </section>

  <!-- The run (D37): the plain facts first (songs done, time left, what didn't go in, that it can be left), a quiet
       line that changes, the song Desk just read with what it found, the figures counted so far, and the crate as a
       wall of waves. Everything drawn is a song Desk read; run.js draws it. -->
  <section id="run" class="screen" aria-labelledby="run-title" hidden>
    <div class="run">
      <!-- The crate's name, to rename while it is read, and Stop (research AE). Drawn by desk.js, not run.js. -->
      <div class="run-head">
        <span class="crate-head">
          <svg class="crate-icon" aria-hidden="true"><use href="#icon-crate"/></svg>
          <button id="run-name-button" class="crate-name" data-w-title="renameCrateHelp"><span id="run-name"></span></button>
        </span>
        <span class="grow"></span>
        <span id="run-stopping" class="mut" data-w="stoppingRun" hidden></span>
        <button id="run-stop" data-w="stopRun" data-w-title="stopRunHelp"></button>
      </div>
      <h1 id="run-title" data-w="runTitle"></h1>
      <p id="run-reading" class="mut"></p>
      <!-- A music CD with no name of its own: asked once, in passing; the run never waits for it (letter AA, 2.5). -->
      <form id="disc-ask" class="disc-ask card" hidden>
        <label for="disc-ask-input"><b data-w="askDiscNameTitle"></b> <span class="mut" data-w="askDiscNameBody"></span></label>
        <div class="row"><input id="disc-ask-input" type="text" autocomplete="off" spellcheck="false"><button class="main" data-w="ok"></button></div>
      </form>
      <div id="run-bar" class="progress waiting" role="progressbar" aria-labelledby="run-title" aria-valuemin="0" aria-valuemax="100"><div></div></div>
      <div class="run-line">
        <span id="run-count"></span>
        <span id="run-stage" class="mut"></span>
        <span id="run-notin" class="warn" hidden></span>
        <span class="grow"></span>
        <span id="run-left" class="mut"></span>
      </div>
      <p id="run-saying" class="saying"></p>
      <p class="leave dim" data-w="leaveRunning"></p>

      <!-- The song on stage: its own wave, its bars marked, and what Desk found in it. -->
      <div id="stage" class="stage card">
        <canvas id="stage-wave" class="stage-wave" role="img"></canvas>
        <div class="stage-facts">
          <p class="stage-name"><b id="stage-title"></b> <span id="stage-artist" class="mut"></span> <span id="stage-before" class="chip" data-w="stageBefore" hidden></span></p>
          <dl class="stage-dl">
            <div><dt data-w="stageTempo"></dt><dd id="stage-tempo" class="tempo"></dd></div>
            <div><dt data-w="stageKey"></dt><dd id="stage-key"></dd></div>
            <div><dt data-w="stageBars"></dt><dd id="stage-bars"></dd></div>
            <div><dt data-w="stageLength"></dt><dd id="stage-length"></dd></div>
            <div class="where"><dt data-w="stageWhere"></dt><dd id="stage-where"></dd></div>
          </dl>
          <p id="stage-more" class="dim small"></p>
        </div>
        <p id="stage-empty" class="stage-empty mut" data-w="stageFirstSoon"></p>
      </div>

      <!-- What Desk has found so far: each a true count. -->
      <div class="figures">
        <div id="fig-music" class="fig card"><h2 data-w="figMusic"></h2><p id="fig-music-value" class="big"></p></div>
        <div id="fig-tempos-card" class="fig card"><h2 data-w="figTempos"></h2><canvas id="fig-tempos" class="hist" role="img"></canvas><p id="fig-tempos-text" class="small mut"></p></div>
        <div id="fig-keys-card" class="fig card fig-keys"><h2 data-w="figKeys"></h2><svg id="fig-keys" class="wheel" role="img"></svg><p id="fig-keys-text" class="small mut"></p></div>
        <div class="fig card fig-list">
          <p><span data-w="figNeedName"></span> <b id="fig-needname"></b></p>
          <p><span data-w="figSameFile"></span> <b id="fig-samefile"></b></p>
          <p><span data-w="figCopies"></span> <b id="fig-copies"></b></p>
          <p><span data-w="figNotIn"></span> <b id="fig-notin"></b></p>
        </div>
      </div>

      <!-- The crate filling up: one line a song. -->
      <div class="wall-card card">
        <div class="wall-head"><h2 id="run-wall-title" data-w="wallTitle"></h2><span id="run-wall-name" class="wall-name mut"></span></div>
        <canvas id="run-wall" class="wall" tabindex="0" role="img" aria-describedby="run-wall-help"></canvas>
        <p id="run-wall-help" class="dim small" data-w="wallHelp"></p>
      </div>

      <details class="run-list"><summary data-w="runListTitle"></summary>
        <ol id="run-log" class="log" role="log" aria-live="off" data-w-label="runTitle"></ol>
      </details>
      <div id="run-announce" class="sr" aria-live="polite" aria-atomic="true"></div>
    </div>
  </section>

  <!-- After a run. -->
  <section id="finished" class="screen" aria-labelledby="finished-title" hidden>
    <div class="finished">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.6 2.6L16 9.6"/></svg>
      <h1 id="finished-title"></h1>
      <p id="finished-stopped" class="mut" data-w="stoppedBody" hidden></p>
      <!-- The crate as sound (D37): the run's songs, one line each, as they joined. -->
      <div id="done-wall-card" class="wall-card card done" hidden>
        <p id="done-moment" class="saying moment"></p>
        <div class="wall-head"><h2 id="done-wall-title"></h2><span id="done-wall-name" class="wall-name mut"></span></div>
        <canvas id="done-wall" class="wall" tabindex="0" role="img" aria-describedby="done-wall-help"></canvas>
        <p id="done-wall-help" class="dim small" data-w="wallHelp"></p>
      </div>
      <div id="finished-summary" class="summary card"></div>
      <p data-w="nextStep"></p>
      <div class="actions">
        <button id="finished-carryon" class="main" data-w="carryOn" hidden></button>
        <button id="finished-export" class="main" data-w="exportCrateFile"></button>
        <!-- A way back to add more (research AE, finding 1), and to take back out what should not have gone in. -->
        <div class="menu-wrap">
          <button id="finished-add" aria-haspopup="menu" aria-expanded="false"><span data-w="addMoreMusic"></span><span class="chev" aria-hidden="true" data-w="glyph.menu"></span></button>
          <ul id="finished-add-menu" class="menu" role="menu" hidden></ul>
        </div>
        <button id="finished-takeout" data-w="takeBackOut" hidden></button>
        <button id="finished-log" data-w="whatDidntGoIn" hidden></button>
        <button id="finished-songs" data-w="seeSongs"></button>
      </div>
      <p id="exported" class="exported" role="status" hidden><span id="exported-text"></span> <button id="exported-open" class="link" data-w="openFolder"></button></p>
      <div class="to-ipad card">
        <h2 data-w="toIPadTitle"></h2>
        <ul>
          <li data-w="toIPadStick"></li>
          <li data-w="toIPadICloud"></li>
          <li data-w="toIPadCable"></li>
        </ul>
      </div>
    </div>
  </section>

  <!-- The crate: its songs, and the sources panel. -->
  <section id="crate" class="screen crate" hidden>
    <div class="table-col">
    <!-- The list of songs that need a name (letter AA, 3.3), with the tools that name many at once (3.6). -->
    <div id="need-bar" class="need-bar" hidden>
      <h2 id="need-title"></h2>
      <span class="grow"></span>
      <button id="need-check" class="small" data-w-title="looksRightHelp"></button>
      <button id="need-lookup" class="small net" hidden></button>
      <div class="menu-wrap">
        <button id="tools-button" class="small" aria-haspopup="menu" aria-expanded="false"><span data-w="nameTools"></span><span class="chev" aria-hidden="true" data-w="glyph.menu"></span></button>
        <ul id="tools-menu" class="menu right" role="menu" hidden></ul>
      </div>
    </div>
    <div class="table-wrap">
      <table id="songs" aria-rowcount="0">
        <caption class="sr" id="songs-caption"></caption>
        <thead><tr id="songs-head"></tr></thead>
        <tbody id="songs-body"></tbody>
      </table>
      <p id="songs-empty" class="empty-filter" hidden></p>
    </div>
    <!-- Listen (D33): play, pause, back and forward, a scrub bar, the position and the length. -->
    <div id="player" class="player" role="region" hidden>
      <button id="player-play" class="small play"></button>
      <button id="player-back" class="small" data-w-label="back30" data-w-title="back30" data-w="back30Short"></button>
      <input id="player-scrub" type="range" min="0" max="1000" value="0" step="1">
      <button id="player-forward" class="small" data-w-label="forward30" data-w-title="forward30" data-w="forward30Short"></button>
      <span id="player-time" class="mut time"></span>
      <span id="player-title" class="title"></span>
      <button id="player-stop" class="small" data-w="stopListening"></button>
    </div>
    </div>
    <!-- One song's names (letter AA, 3.4): each fact with where it came from; a guess looks like a guess. The song's
         cover (D36) is drawn first in it by desk.js, from bytes the engine sends: a data: address, which img-src
         above already allows; nothing is fetched and no path is told. -->
    <aside id="names" class="side names" aria-labelledby="names-title" hidden>
      <header><h2 id="names-title" data-w="names"></h2><button id="names-close" class="small" data-w="done"></button></header>
      <div class="scroll" id="names-body"></div>
    </aside>
    <aside id="side" class="side" aria-labelledby="side-title" hidden>
      <header><h2 id="side-title" data-w="sourcesTitle"></h2><button id="side-close" class="small" data-w="hideSources"></button></header>
      <div class="scroll"><ul id="tree" class="tree"></ul>
        <div id="tree-empty" class="center" hidden>
          <p class="mut" data-w="nothingReadYet"></p>
          <p class="mut" data-w="sourcesEmptyBody"></p>
        </div>
      </div>
      <p class="hint" data-w="fixHint"></p>
    </aside>
  </section>
</main>

<!-- The crate screen's way back to add more, under its songs (research AE, finding 1). -->
<div id="crate-add" class="crate-add" hidden>
  <span id="crate-add-label" class="mut"></span>
  <span id="crate-ways" class="ways"></span>
  <span class="grow"></span>
  <span class="dim" data-w="dropHere"></span>
</div>
<footer id="status" class="status" hidden>
  <b id="status-songs"></b>
  <span id="status-unsigned"></span>
  <button id="status-needname" class="link" aria-pressed="false" hidden></button>
  <span id="status-only" hidden data-w="onlyNeedName"></span>
  <button id="status-notin" class="link" hidden></button>
  <span class="grow"></span>
  <span id="undo-line" role="status" hidden><span id="undo-line-text"></span> <button id="undo-line-button" class="link" data-w="undo"></button></span>
</footer>

<div id="drop" class="drop" hidden><span data-w="dropHere"></span></div>

<!-- One dialog for asking a name, one for confirming, one for a message, one for what did not go in. -->
<dialog id="ask" aria-labelledby="ask-title">
  <form method="dialog">
    <h2 id="ask-title"></h2>
    <label class="sr" for="ask-input" data-w="nameField"></label>
    <input id="ask-input" type="text" autocomplete="off" spellcheck="false">
    <div class="buttons"><button value="cancel" data-w="cancel"></button><button value="ok" class="main" data-w="renameButton"></button></div>
  </form>
</dialog>
<!-- Adding music (research AE): Add drive's and Add CD's lists; a big drive's choice; the count, then the question
     before a large read, with a new crate's name. -->
<dialog id="pick" aria-labelledby="pick-title">
  <form method="dialog">
    <h2 id="pick-title"></h2>
    <p id="pick-body" class="mut"></p>
    <ul id="pick-list" class="pick-list"></ul>
    <p id="pick-empty" class="mut" hidden></p>
    <div class="buttons"><button value="cancel" data-w="cancel"></button></div>
  </form>
</dialog>
<dialog id="bigdrive" aria-labelledby="bigdrive-title" aria-describedby="bigdrive-body">
  <form method="dialog">
    <h2 id="bigdrive-title"></h2>
    <p id="bigdrive-body"></p>
    <div class="buttons"><button value="whole" data-w="readWholeDrive"></button><span class="grow"></span><button value="cancel" data-w="cancel"></button><button value="folder" class="main" data-w="chooseFolderIn"></button></div>
  </form>
</dialog>
<dialog id="askread" aria-labelledby="askread-title" aria-describedby="askread-body">
  <form method="dialog">
    <h2 id="askread-title"></h2>
    <div id="askread-counting"><p class="count" aria-live="polite"><span class="spinner" aria-hidden="true"></span> <span id="askread-count"></span></p><p id="askread-name" class="mut"></p></div>
    <div id="askread-ask" hidden>
      <p id="askread-body"></p>
      <label id="askread-new" class="name-row"><span class="mut" data-w="intoNewCrate"></span> <input id="askread-name-input" type="text" autocomplete="off" spellcheck="false" data-w-label="crateNameLabel"></label>
      <p id="askread-into" class="mut"></p>
    </div>
    <div class="buttons"><button value="cancel" data-w="cancel"></button><button id="askread-start" value="start" class="main" hidden></button></div>
  </form>
</dialog>
<dialog id="confirm" aria-labelledby="confirm-title" aria-describedby="confirm-body">
  <form method="dialog">
    <h2 id="confirm-title"></h2>
    <p id="confirm-body" class="mut"></p>
    <div class="buttons"><button value="cancel" data-w="cancel"></button><button id="confirm-ok" value="ok" class="main"></button></div>
  </form>
</dialog>
<dialog id="message" aria-labelledby="message-title" aria-describedby="message-body">
  <form method="dialog">
    <h2 id="message-title" data-w="appName"></h2>
    <div id="message-body"></div>
    <div class="buttons"><button value="ok" class="main" data-w="ok"></button></div>
  </form>
</dialog>
<dialog id="log" class="wide" aria-labelledby="log-title">
  <form method="dialog">
    <h2 id="log-title" data-w="whatDidntGoIn"></h2>
    <p id="log-read" class="mut"></p>
    <div id="log-groups" class="log-groups"></div>
    <div class="buttons"><button value="ok" class="main" data-w="done"></button></div>
  </form>
</dialog>

<!-- A batch tool: what it works on, its input, and a preview with a tick per field before anything changes. -->
<dialog id="tool" class="wide tool" aria-labelledby="tool-title">
  <form method="dialog">
    <h2 id="tool-title"></h2>
    <div class="tool-top">
      <label><span data-w="toolSongsFrom"></span> <select id="tool-source"></select></label>
      <label class="check"><input id="tool-empty" type="checkbox" checked> <span data-w="onlyEmpty"></span></label>
    </div>
    <div id="tool-paste"><p class="mut" data-w="pasteHelp"></p><textarea id="tool-text" rows="6" spellcheck="false"></textarea></div>
    <div id="tool-pattern"><label for="tool-pattern-input" class="mut" data-w="patternLabel"></label>
      <input id="tool-pattern-input" type="text" list="tool-patterns" autocomplete="off" spellcheck="false"><datalist id="tool-patterns"></datalist>
      <p class="mut small-print" data-w="patternHelp"></p></div>
    <div id="tool-playlist"><p class="mut" data-w="choosePlaylistMessage"></p><button id="tool-choose" type="button" data-w="choosePlaylist"></button> <span id="tool-file" class="mut"></span></div>
    <h3 data-w="previewTitle" class="preview-title"></h3>
    <p id="tool-problem" class="problem" role="status"></p>
    <div class="preview-wrap"><table id="tool-preview"><thead><tr><th></th><th data-w="colSong"></th><th data-w="colField"></th><th data-w="colNow"></th><th data-w="colBecomes"></th></tr></thead><tbody></tbody></table></div>
    <div class="buttons"><button value="cancel" data-w="cancel"></button><button id="tool-apply" value="ok" class="main"></button></div>
  </form>
</dialog>

<!-- "Look up songs via MusicBrainz" (D36): the one step that uses the internet, and looks it. The engine does the
     lookup; this page never touches the network (connect-src 'none' above). Three steps in one dialog: the sentence
     saying what will be sent and to whom, the count while it goes (it can be stopped), then the review with the
     candidates side by side and a tick per field. -->
<dialog id="lookup" class="wide lookup" aria-labelledby="lookup-title">
  <form method="dialog">
    <div class="net-band" role="note"><svg class="net-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.6 2.8 3.9 5.8 3.9 9s-1.3 6.2-3.9 9c-2.6-2.8-3.9-5.8-3.9-9S9.4 5.8 12 3z"/></svg><span id="lookup-kind" data-w="lookupKindLine"></span></div>
    <h2 id="lookup-title"></h2>
    <div id="lookup-ask">
      <label id="lookup-scope-wrap"><span data-w="lookupSongsFrom"></span> <select id="lookup-scope"></select></label>
      <div id="lookup-sentence" class="sentence" aria-live="polite"></div>
    </div>
    <div id="lookup-progress" hidden>
      <div id="lookup-bar" class="progress net" role="progressbar" aria-labelledby="lookup-title" aria-valuemin="0" aria-valuemax="100"><div></div></div>
      <p id="lookup-count" class="count" aria-live="polite"></p>
      <p class="mut" data-w="lookupProgressHelp"></p>
    </div>
    <div id="lookup-review" hidden>
      <p id="lookup-summary" class="summary-line" role="status"></p>
      <p id="lookup-disc" class="mut"></p>
      <p class="mut" data-w="lookupReviewHelp"></p>
      <div id="lookup-songs" class="lookup-songs"></div>
      <p class="mut small-print" data-w="lookupGenreNote"></p>
    </div>
    <div class="buttons">
      <button id="lookup-sent-link" type="button" class="link sent-link" data-w="lookupSentLink"></button>
      <span class="grow"></span>
      <button id="lookup-cancel" value="cancel"></button>
      <button id="lookup-go" type="button" class="main net"></button>
    </div>
  </form>
</dialog>
<dialog id="sent" class="wide sent" aria-labelledby="sent-title">
  <form method="dialog">
    <h2 id="sent-title" data-w="lookupSentTitle"></h2>
    <p class="mut" data-w="lookupSentIntro"></p>
    <ol id="sent-list" class="sent-list"></ol>
    <p id="sent-empty" class="mut" data-w="lookupSentEmpty" hidden></p>
    <div class="buttons"><button id="sent-clear" type="button" class="danger" data-w="lookupSentClear"></button><span class="grow"></span><button value="ok" class="main" data-w="done"></button></div>
  </form>
