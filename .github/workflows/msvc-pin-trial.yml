# TEMPORARY (pc/msvc-pin-2 only): the pin and desk-shell's build, nothing else. Removed before the branch is done.
name: msvc-pin-trial
on:
  push:
    branches: ['pc/msvc-pin-2']
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - name: Pin
        shell: pwsh
        run: ./core/Tools/windows/pin-msvc.ps1
      - name: Build the shell
        working-directory: desk-shell
        run: swift build -v
