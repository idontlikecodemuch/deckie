# The Windows zip a DJ downloads: "Deckie Desk for Windows (first test)". Built on a Windows runner: Deckie Desk (the
# window `deckie-desk` from desk-shell/, its engine `deckie-desk-engine` and the pages from desk-web/), the program
# without a window (`deckie-make`), Swift's runtime libraries, Deckie's own ONNX Runtime, the two models, the icon,
# the licences and the READ ME (core/Tools/windows/package.sh). Then tried as a DJ would use it: unzipped by
# Windows' own tool into a fresh folder whose name has a space, started through "Deckie Desk.exe" and through
# "Make Crate File.exe", with nothing on the path but Windows itself. The zip is kept as a run artifact only: no
# release, no tag, nothing public beyond the artifact.
name: pc-package

on:
  push:
    branches: ['pc/**']
    paths:
      - core/**
      - desk-shell/**
      - desk-web/**
      - deck-app/Deck/Assets.xcassets/AppIcon.appiconset/**
      - .github/workflows/pc-package.yml
  workflow_dispatch:

jobs:
  # The MP3 of the synthesised test track, as in core-windows.yml: encoded on Linux, since no audio is committed
  # and the Windows runner has no MP3 encoder.
  test-mp3:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    container:
      image: swift@sha256:6304481cf2717966b7ba175162e397ea2f2cc3161909f2b2a5cf40036079a0f7 # swift:6.4.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ffmpeg
      - name: Encode the test track
        working-directory: core
        run: swift run deckie-e2e mp3 /tmp/test_track.mp3
      - uses: actions/upload-artifact@v4
        with:
          name: package-test-mp3
          path: /tmp/test_track.mp3
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  package:
    needs: test-mp3
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      ORT_DISABLE_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.4.1-release
          swift-build: 6.4.1-RELEASE
      - name: Cache ONNX Runtime
        id: onnxruntime
        uses: actions/cache@v4
        with:
          path: core/.deps/onnxruntime
          key: onnxruntime-win-x64-deckie-${{ hashFiles('core/Tools/fetch-onnxruntime.sh') }}
      - name: Cache the models
        uses: actions/cache@v4
        with:
          path: core/.models
          key: models-win-models-1-${{ hashFiles('core/Tools/fetch-models.sh', 'core/Tools/export_beat_this.py', 'core/Tools/export_yamnet.py') }}
      - name: Fetch ONNX Runtime (Deckie's own build, checked by hash)
        if: steps.onnxruntime.outputs.cache-hit != 'true'
        shell: bash
        run: bash core/Tools/fetch-onnxruntime.sh --deckie
      - name: Fetch the models from the release models-1 (checked by hash)
        shell: bash
        run: bash core/Tools/fetch-models.sh --no-export
      # The icon is made here from the iPad app's picture and compiled into a resource file, the form a linker takes;
      # no .ico is committed (core/Tools/windows/icon.sh, make_ico.py).
      - name: Make the icon
        shell: bash
        run: bash core/Tools/windows/icon.sh "$RUNNER_TEMP/icon"
      - name: Build the programs and the test tool (release)
        working-directory: core
        run: |
          swift build -c release --product deckie-make
          if ($LASTEXITCODE -ne 0) { exit 1 }
          swift build -c release --product deckie-desk-engine
          if ($LASTEXITCODE -ne 0) { exit 1 }
          swift build -c release --product deckie-e2e
          if ($LASTEXITCODE -ne 0) { exit 1 }
      # The window, with the icon linked in. Git Bash runs it so that the resource file can be named the Windows way
      # with forward slashes, which every tool on the way to the linker takes.
      - name: Build the window (release, with its icon)
        shell: bash
        working-directory: desk-shell
        run: swift build -c release -Xlinker "$(cygpath -m "$RUNNER_TEMP/icon/desk.res")"
      # The shipped library must carry no usage-reporting client: the same scan the ONNX Runtime build's gate uses.
      - name: Scan the ONNX Runtime library that ships
        shell: pwsh
        run: ./core/Tools/scan-onnxruntime.ps1 core\.deps\onnxruntime\lib\onnxruntime.dll
      - name: Assemble the zip
        shell: bash
        run: |
          DECKIE_ICON="$RUNNER_TEMP/icon" bash core/Tools/windows/package.sh "$RUNNER_TEMP/package"
          {
            echo "## The zip"
            cat "$RUNNER_TEMP/package/package-report.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the zip
        uses: actions/upload-artifact@v4
        with:
          name: Deckie-Desk-for-Windows-first-test
          path: ${{ runner.temp }}\package\Deckie-Desk-for-Windows-first-test.zip
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

      # From here on: the zip used as a DJ would use it. Unzipped by Windows' own tool into a fresh folder whose
      # name has a space; PATH cut down to Windows itself, so a library missing from the zip cannot be found in the
      # Swift toolchain this runner has. (The runner does have Microsoft's Visual C++ runtime in System32, as most
      # PCs do; a PC without it cannot be tried here.)
      - name: "Try it: unzip into a fresh folder"
        shell: pwsh
        run: |
          $dest = Join-Path $env:RUNNER_TEMP "A DJ's PC"
          Expand-Archive -Path (Join-Path $env:RUNNER_TEMP "package\Deckie-Desk-for-Windows-first-test.zip") -DestinationPath $dest
          Get-ChildItem -Recurse $dest | Select-Object -First 60 FullName, Length | Format-Table -AutoSize | Out-String -Width 200
      - name: "Try it: the test MP3 made on Linux in this run"
        uses: actions/download-artifact@v4
        with:
          name: package-test-mp3
          path: ${{ runner.temp }}\package-mp3
      - name: "Try it: a folder dropped on Make Crate File (awkward names, three file types, hidden files)"
        shell: pwsh
        run: |
          $tool = "core\.build\release\deckie-e2e.exe"
          $music = Join-Path $env:RUNNER_TEMP "tester\My Müsic"
          & $tool make $music --mp3 (Join-Path $env:RUNNER_TEMP "package-mp3\test_track.mp3")
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $saved = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $exe = Join-Path $env:RUNNER_TEMP "A DJ's PC\Deckie Desk for Windows (first test)\Make Crate File.exe"
          & $exe $music --no-wait
          $code = $LASTEXITCODE
          $env:PATH = $saved
          if ($code -ne 0) { Write-Error "Make Crate File ended with code $code"; exit 1 }
          $crate = Join-Path $env:RUNNER_TEMP "tester\My Müsic.deckiecrate"
          $log = Join-Path $env:RUNNER_TEMP "tester\My Müsic Deckie log.txt"
          if (-not (Test-Path $crate -PathType Leaf)) { Write-Error "no crate file next to the music folder"; exit 1 }
          if (-not (Test-Path $log -PathType Leaf)) { Write-Error "no log next to the music folder"; exit 1 }
          "Next to the music folder:"; Get-ChildItem (Join-Path $env:RUNNER_TEMP "tester") | Format-Table Name, Length
          Get-Content $log
          # The PC program reads every folder (it has no "_" rule), so the parked song goes in: 4 songs.
          & $tool check-pc $crate
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: "Try it: a second run reads nothing again"
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $exe = Join-Path $env:RUNNER_TEMP "A DJ's PC\Deckie Desk for Windows (first test)\Make Crate File.exe"
          $said = & $exe (Join-Path $env:RUNNER_TEMP "tester\My Müsic") --no-wait | Out-String
          $said
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($said -notmatch "Nothing has changed since last time") { Write-Error "the second run read songs again"; exit 1 }
      - name: "Try it: a double click (no folder given; the path is typed at the prompt)"
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $exe = Join-Path $env:RUNNER_TEMP "A DJ's PC\Deckie Desk for Windows (first test)\Make Crate File.exe"
          $music = Join-Path $env:RUNNER_TEMP "tester\My Müsic"
          # A wrong path first, then the right one in quotes, as Windows pastes a dropped folder.
          $said = "C:\no such folder", "`"$music`"" | & $exe --no-wait | Out-String
          $said
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($said -notmatch "Which folder is your music in") { Write-Error "it did not ask for the folder"; exit 1 }
          if ($said -notmatch "There is no folder at") { Write-Error "the wrong path was not said plainly"; exit 1 }
          if ($said -notmatch "Done\. 4 songs are in the crate file") { Write-Error "it did not finish"; exit 1 }
      - name: "Try it: started without unzipping the rest (the starter alone)"
        shell: pwsh
        run: |
          $alone = Join-Path $env:RUNNER_TEMP "alone"
          New-Item -ItemType Directory -Force $alone | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP "A DJ's PC\Deckie Desk for Windows (first test)\Make Crate File.exe") $alone
          $said = "" | & (Join-Path $alone "Make Crate File.exe") | Out-String
          $said
          if ($LASTEXITCODE -ne 3) { Write-Error "expected the starter to end with 3, got $LASTEXITCODE"; exit 1 }
          if ($said -notmatch "Unzip first") { Write-Error "the starter did not say to unzip"; exit 1 }
          exit 0  # the starter's 3 is the expected ending here, not this step's
      # ---- Deckie Desk, from the same unzipped folder, with PATH cut down to Windows itself.
      #
      # "Deckie Desk.exe" is started with Start-Process and nothing redirected, which is how a program is started
      # with no console of its own to write to; what the check sees it writes to a file (--check-log). The runner
      # has no screen a person sees, so "the window opened" here means: the window was made, the page loaded in it
      # and drew the engine's words, and said so. A real double click in Explorer is for a person (the check-in).
      - name: "Try Desk: every program is the kind it should be (console window or not, icon or not)"
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "A DJ's PC\Deckie Desk for Windows (first test)"
          $said = python core\Tools\windows\pe_kind.py "$root\Deckie Desk.exe" "$root\Make Crate File.exe" "$root\app\deckie-desk.exe" "$root\app\deckie-desk-engine.exe" "$root\app\deckie-make.exe" | Out-String
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $said
          foreach ($want in "Deckie Desk.exe: window icon", "Make Crate File.exe: console icon", "deckie-desk.exe: window icon", "deckie-desk-engine.exe: window", "deckie-make.exe: console") {
            if (-not $said.Contains($want)) { Write-Error "expected: $want"; exit 1 }
          }
          foreach ($f in "app\desk-web\index.html", "app\desk-web\desk.js", "app\desk-web\desk.css", "app\licences\webview-LICENSE.txt", "app\licences\Microsoft-WebView2-SDK-LICENSE.txt", "app\licences\ACKNOWLEDGEMENTS.txt", "READ ME FIRST.txt") {
            if (-not (Test-Path (Join-Path $root $f) -PathType Leaf)) { Write-Error "not in the zip: $f"; exit 1 }
          }
      - name: "Try Desk: started twice; the window opens and the page shows the engine's words (start-up time)"
        shell: pwsh
        run: |
          $desk = Join-Path $env:RUNNER_TEMP "A DJ's PC\Deckie Desk for Windows (first test)\Deckie Desk.exe"
          $work = Join-Path $env:RUNNER_TEMP "desk-check"
          New-Item -ItemType Directory -Force $work | Out-Null
          $env:DECKIE_DESK_HOME = Join-Path $work "desk"
          $env:DECKIE_DJ_HOME = Join-Path $work "dj"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $times = @()
          foreach ($n in 1, 2) {
            $log = Join-Path $work "start-$n.log"
            $t0 = [DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
            $p = Start-Process -FilePath $desk -ArgumentList "--check --check-log `"$log`"" -PassThru
            $handle = $p.Handle   # kept, so that the exit code can be read after it ends
            if (-not $p.WaitForExit(180000)) { $p.Kill(); if (Test-Path $log) { Get-Content $log }; Write-Error "Deckie Desk did not finish its check in 3 minutes"; exit 1 }
            if (Test-Path $log) { Get-Content $log } else { "no log was written" }
            if ($p.ExitCode -ne 0) { Write-Error "Deckie Desk's check ended with code $($p.ExitCode)"; exit 1 }
            $said = Get-Content $log | Out-String
            if ($said -notmatch "window made with WebView2") { Write-Error "no window was made"; exit 1 }
            if ($said -notmatch "its own icon on the window: yes") { Write-Error "the window does not carry Desk's icon"; exit 1 }
            if ($said -notmatch 'heading "[^"]+", button "Add music"') { Write-Error "the page did not show the engine's words"; exit 1 }
            if ($said -notmatch 'ready": (1|true)') { Write-Error "the engine did not find ONNX Runtime and the models beside itself"; exit 1 }
            if ($said -notmatch "PASSED") { Write-Error "the check did not pass"; exit 1 }
            if ($said -notmatch "at unix ms (\d+)") { Write-Error "no start-up time in the log"; exit 1 }
            $whole = ([double]$Matches[1] - $t0) / 1000
            $null = $said -match "engine's words ([0-9.]+) s after the program started"
            $inside = $Matches[1]
            $line = "start $n`: the page showed the engine's words $('{0:N2}' -f $whole) s after Deckie Desk.exe was started ($inside s of that inside deckie-desk.exe)"
            $line
            $times += $line
          }
          $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1).Name
          "## Deckie Desk: start-up time on this runner" >> $env:GITHUB_STEP_SUMMARY
          "From starting ``Deckie Desk.exe`` in the unzipped folder to the page having drawn the engine's words. The first start is this account's first ever (WebView2 makes its storage folder); the second is a normal one. Processor: $cpu." >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          $times | ForEach-Object { "- $_" } >> $env:GITHUB_STEP_SUMMARY
      - name: "Try Desk: add a music folder through the page, let the run finish, export the crate file, read it back"
        shell: pwsh
        run: |
          $tool = "core\.build\release\deckie-e2e.exe"
          $work = Join-Path $env:RUNNER_TEMP "desk-check"
          $music = Join-Path $env:RUNNER_TEMP "desk tester\My Müsic"
          $out = Join-Path $env:RUNNER_TEMP "desk tester\For the iPad"
          New-Item -ItemType Directory -Force $out | Out-Null
          & $tool make $music --mp3 (Join-Path $env:RUNNER_TEMP "package-mp3\test_track.mp3")
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $desk = Join-Path $env:RUNNER_TEMP "A DJ's PC\Deckie Desk for Windows (first test)\Deckie Desk.exe"
          $env:DECKIE_DESK_HOME = Join-Path $work "desk"
          $env:DECKIE_DJ_HOME = Join-Path $work "dj"
          $saved = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $log = Join-Path $work "run.log"
          $p = Start-Process -FilePath $desk -ArgumentList "--check --check-log `"$log`" --music `"$music`" --export-to `"$out`"" -PassThru
          $handle = $p.Handle
          $done = $p.WaitForExit(1200000)
          $env:PATH = $saved
          if (-not $done) { $p.Kill(); if (Test-Path $log) { Get-Content $log }; Write-Error "Deckie Desk did not finish the run in 20 minutes"; exit 1 }
          if (Test-Path $log) { Get-Content $log } else { "no log was written" }
          if ($p.ExitCode -ne 0) { Write-Error "Deckie Desk's run ended with code $($p.ExitCode)"; exit 1 }
          $crate = Join-Path $out "My Müsic.deckiecrate"
          if (-not (Test-Path $crate -PathType Leaf)) { Write-Error "the exported crate file is not one file at $crate"; exit 1 }
          "Exported:"; Get-ChildItem $out | Format-Table Name, Length
          # The core's validator: one file, the 4 songs of the test folder, each from the source "My Müsic".
          $read = & $tool check-desk $crate "My Müsic" | Out-String
          $read
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if ($read -notmatch "single-file form") { Write-Error "the crate file is not in the single-file form"; exit 1 }
          "## Deckie Desk: a run from the zip" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          Get-Content $log | Where-Object { $_ -match "run started|run finished|finished screen|crate file exported|PASSED" } >> $env:GITHUB_STEP_SUMMARY
          $read >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
      - name: "Try Desk: started without unzipping the rest (the starter alone)"
        shell: pwsh
        run: |
          $alone = Join-Path $env:RUNNER_TEMP "desk alone"
          New-Item -ItemType Directory -Force $alone | Out-Null
          Copy-Item (Join-Path $env:RUNNER_TEMP "A DJ's PC\Deckie Desk for Windows (first test)\Deckie Desk.exe") $alone
          $env:DECKIE_NO_BOXES = "1"   # the message goes to standard error, not into a box that waits for a click
          $err = Join-Path $alone "said.txt"
          $p = Start-Process -FilePath (Join-Path $alone "Deckie Desk.exe") -RedirectStandardError $err -PassThru
          $handle = $p.Handle
          if (-not $p.WaitForExit(60000)) { $p.Kill(); Write-Error "the starter did not end"; exit 1 }
          $said = Get-Content $err | Out-String
          $said
          if ($p.ExitCode -ne 3) { Write-Error "expected the starter to end with 3, got $($p.ExitCode)"; exit 1 }
          if ($said -notmatch "Unzip first") { Write-Error "the starter did not say to unzip"; exit 1 }
          if ($said -notmatch 'start "Deckie Desk" from there') { Write-Error "the starter did not name itself"; exit 1 }
      # A PC without Microsoft's WebView2 Runtime. The runner has it, so it is hidden for a moment: the registry
      # values that say where it is (the ones the window's loader reads, and the ones Microsoft documents for
      # "is it installed") are renamed, Deckie Desk is started, and they are put back. Where the runner does not
      # allow that, the program's own switch (DECKIE_DESK_NO_WEBVIEW2) stands in, which tries the message and not
      # the detection; the summary says which it was. The message box itself is not shown here (DECKIE_NO_BOXES):
      # nobody could click it.
      - name: "Try Desk: a PC without the WebView2 Runtime"
        shell: pwsh
        run: |
          $desk = Join-Path $env:RUNNER_TEMP "A DJ's PC\Deckie Desk for Windows (first test)\Deckie Desk.exe"
          $work = Join-Path $env:RUNNER_TEMP "desk-check"
          $env:DECKIE_DESK_HOME = Join-Path $work "desk"
          $env:DECKIE_DJ_HOME = Join-Path $work "dj"
          $env:DECKIE_NO_BOXES = "1"
          $guid = "{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
          $spots = @(
            @{ Key = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\ClientState\$guid"; Name = "EBWebView" },
            @{ Key = "HKCU:\Software\Microsoft\EdgeUpdate\ClientState\$guid"; Name = "EBWebView" },
            @{ Key = "HKLM:\SOFTWARE\WOW6432Node\Microsoft\EdgeUpdate\Clients\$guid"; Name = "pv" },
            @{ Key = "HKCU:\Software\Microsoft\EdgeUpdate\Clients\$guid"; Name = "pv" }
          )
          $suffix = "-hidden-by-deckie-check"
          $hidden = @()
          $how = "the registry values that say where the WebView2 Runtime is were renamed, so the program's own detection said no"
          $code = -1
          $log = Join-Path $work "no-webview2.log"
          try {
            try {
              foreach ($s in $spots) {
                if (-not (Test-Path -LiteralPath $s.Key)) { "$($s.Key): not present"; continue }
                $value = (Get-ItemProperty -LiteralPath $s.Key).($s.Name)
                if ($null -eq $value) { "$($s.Key) has no $($s.Name)"; continue }
                Rename-ItemProperty -LiteralPath $s.Key -Name $s.Name -NewName ($s.Name + $suffix) -ErrorAction Stop
                $hidden += $s
                "$($s.Key): $($s.Name) = $value, hidden"
              }
              if ($hidden.Count -eq 0) { throw "nothing to hide" }
            } catch {
              "Could not hide the runtime ($_); using the program's own switch instead."
              $how = "the runner did not allow the runtime to be hidden, so the program's switch DECKIE_DESK_NO_WEBVIEW2 stood in: the message was tried, the detection was not"
              $env:DECKIE_DESK_NO_WEBVIEW2 = "1"
            }
            $saved = $env:PATH
            $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
            $p = Start-Process -FilePath $desk -ArgumentList "--check-log `"$log`"" -PassThru
            $handle = $p.Handle
            $done = $p.WaitForExit(120000)
            $env:PATH = $saved
            if ($done) { $code = $p.ExitCode } else { $p.Kill(); "Deckie Desk did not end within 2 minutes; without the runtime it should say so and stop" }
          } finally {
            foreach ($s in $hidden) { Rename-ItemProperty -LiteralPath $s.Key -Name ($s.Name + $suffix) -NewName $s.Name }
          }
          "How: $how"
          $said = if (Test-Path $log) { Get-Content $log | Out-String } else { "" }
          $said
          if ($code -ne 4) { Write-Error "expected Deckie Desk to end with 4 (no WebView2 Runtime), got $code"; exit 1 }
          foreach ($want in "Microsoft's WebView2 Runtime", "https://developer.microsoft.com/microsoft-edge/webview2/", "Make Crate File", "WebView2 Runtime by the registry: not installed") {
            if (-not $said.Contains($want)) { Write-Error "the message does not say: $want"; exit 1 }
          }
          "## Deckie Desk: a PC without the WebView2 Runtime" >> $env:GITHUB_STEP_SUMMARY
          "How it was tried: $how. Deckie Desk ended with code 4 and these words (in a message box on a real PC; on standard error here):" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          $said >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          # And with the values back, the window opens again.
          $env:DECKIE_NO_BOXES = $null
          $env:DECKIE_DESK_NO_WEBVIEW2 = $null
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $again = Join-Path $work "after.log"
          $p = Start-Process -FilePath $desk -ArgumentList "--check --check-log `"$again`"" -PassThru
          $handle = $p.Handle
          if (-not $p.WaitForExit(180000)) { $p.Kill(); Write-Error "Deckie Desk did not start again after the runtime was put back"; exit 1 }
          Get-Content $again | Select-Object -Last 3
          if ($p.ExitCode -ne 0) { Write-Error "after the runtime was put back the check ended with code $($p.ExitCode)"; exit 1 }
      # Time per song on this runner, on songs of a real length: four synthesised four-minute songs (two WAV, two
      # FLAC), read with the program's own default for songs at once. The log's numbers go into the summary.
      - name: "Measure: four four-minute songs"
        shell: pwsh
        run: |
          $tool = "core\.build\release\deckie-e2e.exe"
          $music = Join-Path $env:RUNNER_TEMP "timing\Four Songs"
          & $tool songs $music --count 4 --seconds 240
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $exe = Join-Path $env:RUNNER_TEMP "A DJ's PC\Deckie Desk for Windows (first test)\Make Crate File.exe"
          & $exe $music --no-wait
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $log = Get-Content (Join-Path $env:RUNNER_TEMP "timing\Four Songs Deckie log.txt")
          $log
          $cpu = (Get-CimInstance Win32_Processor | Select-Object -First 1).Name
          "## Time per song on this runner" >> $env:GITHUB_STEP_SUMMARY
          "Four synthesised four-minute songs (44.1 kHz stereo; two WAV, two FLAC), release build, from the zip. Processor: $cpu." >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
          $log | Where-Object { $_ -match "^(system|processors|seconds per song|whole run|songs in)" } >> $env:GITHUB_STEP_SUMMARY
          '```' >> $env:GITHUB_STEP_SUMMARY
