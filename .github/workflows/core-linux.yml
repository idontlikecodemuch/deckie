# DeckieCore on Linux: build and run the parity tests in the official Swift 6.4.1 image (Ubuntu 24.04).
name: core-linux

on:
  push:
    branches: [main, pc-linux]
    paths: [core/**, mixer/features/**, mixer/candidates.json, mixer/recs.json, .github/workflows/core-linux.yml]
  pull_request:
    paths: [core/**, mixer/features/**, mixer/candidates.json, mixer/recs.json, .github/workflows/core-linux.yml]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    container: swift:6.4.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        working-directory: core
        run: swift build -v
      - name: Test
        working-directory: core
        run: swift test
