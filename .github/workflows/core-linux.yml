# DeckieCore on Linux: build and run the parity tests in the official Swift 6.4.1 image (Ubuntu 24.04).
name: core-linux

on:
  push:
    branches: [main, pc-linux]
    paths: [core/**, mixer/features/**, mixer/candidates.json, mixer/recs.json, .github/workflows/core-linux.yml]
  pull_request:
    paths: [core/**, mixer/features/**, mixer/candidates.json, mixer/recs.json, .github/workflows/core-linux.yml]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      # ONNX Runtime's official builds report usage to Microsoft unless this is set before they start; Deckie's
      # shim and the Python tools set it themselves, this covers every step here as well (DEPENDENCIES.md, 6).
      ORT_DISABLE_TELEMETRY: "1"
    # A guard, not a target. Estimated from this session's machine (not yet timed on GitHub): the caches below add
    # about 40 s to a run when they hit (restoring 110 MB, then the beat tracker's tests), about 3 minutes when not;
    # the vocal tagger's cache and tests add about 45 s more when it hits and about 2 minutes when not.
    timeout-minutes: 25
    container:
      # The official Swift 6.4.1 image on Ubuntu 24.04, pinned by its multi-architecture index digest (DEPENDENCIES.md).
      image: swift@sha256:6304481cf2717966b7ba175162e397ea2f2cc3161909f2b2a5cf40036079a0f7 # swift:6.4.1-noble
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      # ONNX Runtime and the Beat This! model, so that the beat tracker's tests run here rather than skip. Both are
      # cached between runs: ONNX Runtime by the fetch script's hash (the script pins the archive by its SHA-256),
      # the model by the hash of the export script and its pinned requirements (the script holds the model's pinned
      # SHA-256), so it is fetched or exported once and again only when either changes. On a miss the model comes
      # from the repository's release models-1 (fetch-models.sh, below: seconds), and is exported only when the
      # release does not have it; such a run spends about 3 minutes here (apt; pip with the CPU-only torch, 40 s
      # here; the 81 MB checkpoint, the export and its check, 50 s here). One that hits the caches, seconds.
      - name: Cache ONNX Runtime
        id: onnxruntime
        uses: actions/cache@v4
        with:
          path: core/.deps/onnxruntime
          key: onnxruntime-linux-x64-${{ hashFiles('core/Tools/fetch-onnxruntime.sh') }}
      - name: Cache the Beat This! model
        id: model
        uses: actions/cache@v4
        with:
          path: core/.models
          key: beat-this-onnx-${{ hashFiles('core/Tools/export_beat_this.py', 'core/Tools/export-requirements.txt') }}
      # The vocal tagger's model (YAMNet, 14.9 MB), so its tests and the engine's vocal tests run here rather than
      # skip: fetched from the release like the beat model or, when the release does not have it, by the pinned-hash
      # script, which exports it with TensorFlow; cached by the hash of the script, the export script and their pinned
      # requirements. A run that misses the cache and the release spends about 70 s more here, measured in a fresh
      # Python 3.12 environment as this image has (pip with TensorFlow's CPU build, a 274 MB wheel, 51 s with nothing
      # cached; the 15 MB weights, the export and its check, 17 s; the same model bytes as the recorded export); the
      # tests themselves add about 45 s to every run (the vocal track, four minutes of audio, the engine on the track).
      - name: Cache the YAMNet model
        id: yamnet
        uses: actions/cache@v4
        with:
          path: core/.models/yamnet.onnx
          key: yamnet-onnx-${{ hashFiles('core/Tools/fetch-vocal-models.sh', 'core/Tools/export_yamnet.py', 'core/Tools/yamnet-export-requirements.txt') }}
      - name: Install curl (only when a cache missed)
        if: steps.onnxruntime.outputs.cache-hit != 'true' || steps.model.outputs.cache-hit != 'true' || steps.yamnet.outputs.cache-hit != 'true'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl
      - name: Fetch ONNX Runtime (checked by hash)
        if: steps.onnxruntime.outputs.cache-hit != 'true'
        run: bash core/Tools/fetch-onnxruntime.sh
      # Each file is checked against the SHA-256 pinned in its export script before it is moved into place, so the
      # release cannot bring a wrong file. A model it does not have (a 404, until models-1 exists) is exported below.
      - name: Fetch the models from the release models-1 (checked by hash)
        id: fetch
        if: steps.model.outputs.cache-hit != 'true' || steps.yamnet.outputs.cache-hit != 'true'
        env:
          BEAT_THIS_CACHED: ${{ steps.model.outputs.cache-hit }}
          YAMNET_CACHED: ${{ steps.yamnet.outputs.cache-hit }}
        run: |
          # One model at a time, so that a miss on one exports only that one; --no-export, since the steps below
          # export with Python environments of their own.
          if [ "$BEAT_THIS_CACHED" != true ] && bash core/Tools/fetch-models.sh --no-export --beat-this; then
            echo "beat_this=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$YAMNET_CACHED" != true ] && bash core/Tools/fetch-models.sh --no-export --yamnet; then
            echo "yamnet=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Export the Beat This! model (checked against PyTorch; only when the release did not have it)
        if: steps.model.outputs.cache-hit != 'true' && steps.fetch.outputs.beat_this != 'true'
        run: |
          apt-get install -y --no-install-recommends python3 python3-venv
          python3 -m venv /tmp/export-venv
          /tmp/export-venv/bin/python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.15.0+cpu torchaudio==2.11.1+cpu
          /tmp/export-venv/bin/python -m pip install -r core/Tools/export-requirements.txt
          /tmp/export-venv/bin/python -P core/Tools/export_beat_this.py
      - name: Fetch and export the YAMNet model (checked by hash and against TensorFlow; only when the release did not have it)
        if: steps.yamnet.outputs.cache-hit != 'true' && steps.fetch.outputs.yamnet != 'true'
        run: |
          apt-get install -y --no-install-recommends python3 python3-venv
          python3 -m venv /tmp/yamnet-venv
          /tmp/yamnet-venv/bin/python -m pip install -r core/Tools/yamnet-export-requirements.txt
          /tmp/yamnet-venv/bin/python -m pip install --no-deps tf-keras==2.21.0
          # --force: export even if the Beat This! cache, which holds all of core/.models, brought back an older file.
          bash core/Tools/fetch-vocal-models.sh --force --python /tmp/yamnet-venv/bin/python
      # The two models with their .sha256 files as one run artifact, for a machine that cannot export them and while
      # the release models-1 does not exist (the Mac): gh run download <run id> -n <name>. The name carries the first
      # eight digits of each file's SHA-256 (models-beat-this-f1d93204-yamnet-96bb0dc5 for the pinned files), and
      # the upload happens only when both are the pinned files (fetch-models.sh --check), so an export made with
      # other tool versions never travels under the pinned name.
      - name: Write the models' SHA-256 files
        id: sums
        working-directory: core/.models
        run: |
          sha256sum beat_this_final0.onnx > beat_this_final0.onnx.sha256
          sha256sum yamnet.onnx > yamnet.onnx.sha256
          cat beat_this_final0.onnx.sha256 yamnet.onnx.sha256
          echo "beat_this=$(cut -c1-8 beat_this_final0.onnx.sha256)" >> "$GITHUB_OUTPUT"
          echo "yamnet=$(cut -c1-8 yamnet.onnx.sha256)" >> "$GITHUB_OUTPUT"
          if bash ../Tools/fetch-models.sh --check; then
            echo "pinned=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Models::not the pinned files (see the step's log), so they are not uploaded as an artifact"
          fi
      - name: Upload the models as a run artifact
        if: steps.sums.outputs.pinned == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: models-beat-this-${{ steps.sums.outputs.beat_this }}-yamnet-${{ steps.sums.outputs.yamnet }}
          path: |
            core/.models/beat_this_final0.onnx
            core/.models/beat_this_final0.onnx.sha256
            core/.models/yamnet.onnx
            core/.models/yamnet.onnx.sha256
          retention-days: 90
          compression-level: 0
          if-no-files-found: error
          include-hidden-files: true # the folder .models starts with a dot, which the action otherwise skips
      - name: Build
        working-directory: core
        run: swift build -v
      - name: Test
        working-directory: core
        run: swift test
