# The Windows probe: build and run the same DeckieCore tests on a Windows runner with the official Swift
# toolchain. A failure here is evidence for the Swift-on-Windows decision, not a broken build to hide.
name: core-windows

on:
  push:
    branches: [main, pc-linux]
    paths: [core/**, mixer/features/**, mixer/candidates.json, mixer/recs.json, .github/workflows/core-windows.yml]
  pull_request:
    paths: [core/**, mixer/features/**, mixer/candidates.json, mixer/recs.json, .github/workflows/core-windows.yml]
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # The action's documented reference is @main; its tag v3 does not exist (first probe run, Oct 28).
      # Pinning to a commit hash is pending (DEPENDENCIES.md).
      # 6.4.0, not 6.4.1: on Oct 28 swift.org's own link for the 6.4.1 Windows installer answered 404
      # (download.swift.org/swift-6.4.1-release/windows10/swift-6.4.1-RELEASE/swift-6.4.1-RELEASE-windows10.exe),
      # so the probe uses the previous 6.4 build until that file is back. Linux stays on 6.4.1.
      - uses: compnerd/gha-setup-swift@main
        with:
          swift-version: swift-6.4-release
          swift-build: 6.4.0-RELEASE
      - name: Swift version
        run: swift --version
      - name: Build
        working-directory: core
        run: swift build -v
      - name: Test
        working-directory: core
        run: swift test
