name: Deck
options:
  bundleIdPrefix: io.deckie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 566NNM5HT8
    CODE_SIGN_STYLE: Automatic
packages:
  DeckieCore:
    path: ../core
targets:
  Deck:
    type: application
    platform: iOS
    sources:
      - path: Deck/Sources
      - path: Deck/Assets.xcassets
      - path: Deck/Resources
        buildPhase: resources
    dependencies:
      - package: DeckieCore
        product: DeckieCore
      - package: DeckieCore
        product: DeckieCrate
      - package: DeckieCore
        product: DeckieRecognition
    info:
      path: Deck/Info.plist
      properties:
        CFBundleDisplayName: Deckie Booth
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: ""
        NSMicrophoneUsageDescription: "Deckie Booth listens to the music to recognise which song is playing. Audio never leaves the iPad."
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UIFileSharingEnabled: true
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        # The crate file (D21): one extension, .deckie, for both forms, the package a Mac writes and the single file
        # a PC writes (docs/architecture/crate-format.md, "The single-file form"; README "Crate files from a PC" for
        # the evidence). Two type ids because the system needs one for a folder and one for a plain file. Both take
        # the earlier extension .deckiecrate too, read for good. Deckie Desk (desk-app/project.yml) declares the same.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.deckie.crate
            UTTypeDescription: Deckie crate file
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [deckie, deckiecrate]
          - UTTypeIdentifier: io.deckie.crate-file
            UTTypeDescription: Deckie crate file
            UTTypeConformsTo: [public.data, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [deckie, deckiecrate]
        # The type ids used before (under the earlier prefix), kept importable so a file tagged with one still opens;
        # each conforms to its new id. They claim no extension: .deckiecrate resolves to the new ids above, one type
        # for a folder and one for a file, as before.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: io.christophershannon.deckie.crate
            UTTypeDescription: Deckie crate file
            UTTypeConformsTo: [io.deckie.crate, com.apple.package, public.composite-content]
          - UTTypeIdentifier: io.christophershannon.deckie.crate-file
            UTTypeDescription: Deckie crate file
            UTTypeConformsTo: [io.deckie.crate-file, public.data, public.composite-content]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Deckie crate file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [io.deckie.crate, io.deckie.crate-file, io.christophershannon.deckie.crate, io.christophershannon.deckie.crate-file]
        CFBundleURLTypes:
          - CFBundleURLName: io.deckie.booth
            CFBundleURLSchemes: [deck]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.deckie.booth
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
