name: Deck
options:
  bundleIdPrefix: io.deckie
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 566NNM5HT8
    CODE_SIGN_STYLE: Automatic
packages:
  DeckieCore:
    path: ../core
targets:
  Deck:
    type: application
    platform: iOS
    # Every file the app carries is named here, one by one. No folder is bundled whole, so nothing a developer keeps in
    # the checkout (the party's data in Deck/Resources, made by tools/prep_data.py and git-ignored) can ride along.
    # The demo crate file is named here too: Deck/Demo/Demo.deckie, a crate package (facts and fingerprints of seven
    # public-domain songs, no audio; FirstRun.swift, DemoCrate; site/demo/CREDITS.md), copied whole as a folder.
    sources:
      - path: Deck/Sources
      - path: Deck/Assets.xcassets
      - path: Deck/PrivacyInfo.xcprivacy
        buildPhase: resources
      - path: Deck/Demo/Demo.deckie
        type: folder
        buildPhase: resources
    dependencies:
      - package: DeckieCore
        product: DeckieCore
      - package: DeckieCore
        product: DeckieCrate
      - package: DeckieCore
        product: DeckieRecognition
      # The switching rule, the picks and their words, shared with Desk's Booth (D42).
      - package: DeckieCore
        product: DeckieBooth
    info:
      path: Deck/Info.plist
      properties:
        CFBundleDisplayName: Deckie
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "4"
        UILaunchScreen:
          UIColorName: ""
        NSMicrophoneUsageDescription: "Deckie listens to the music to recognise which song is playing. Audio never leaves the iPad."
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIUserInterfaceStyle: Dark
        UIFileSharingEnabled: true
        UIBackgroundModes: [audio]
        ITSAppUsesNonExemptEncryption: false
        LSSupportsOpeningDocumentsInPlace: true
        # The crate file (D21): one extension, .deckie, for both forms, the package a Mac writes and the single file
        # a PC writes (docs/architecture/crate-format.md, "The single-file form"; README "Crate files from a PC" for
        # the evidence). Two type ids because the system needs one for a folder and one for a plain file. Both take
        # the earlier extension .deckiecrate too, read for good. Deckie Desk (desk-app/project.yml) declares the same.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.deckie.crate
            UTTypeDescription: Deckie crate file
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [deckie, deckiecrate]
          - UTTypeIdentifier: io.deckie.crate-file
            UTTypeDescription: Deckie crate file
            UTTypeConformsTo: [public.data, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [deckie, deckiecrate]
        # The type ids used before (under the earlier prefix), kept importable so a file tagged with one still opens;
        # each conforms to its new id. They claim no extension: .deckiecrate resolves to the new ids above, one type
        # for a folder and one for a file, as before.
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: io.christophershannon.deckie.crate
            UTTypeDescription: Deckie crate file
            UTTypeConformsTo: [io.deckie.crate, com.apple.package, public.composite-content]
          - UTTypeIdentifier: io.christophershannon.deckie.crate-file
            UTTypeDescription: Deckie crate file
            UTTypeConformsTo: [io.deckie.crate-file, public.data, public.composite-content]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Deckie crate file
            CFBundleTypeRole: Viewer
            LSHandlerRank: Owner
            LSItemContentTypes: [io.deckie.crate, io.deckie.crate-file, io.christophershannon.deckie.crate, io.christophershannon.deckie.crate-file]
        # No URL scheme here: the deck:// test hooks are for Debug builds only, and the script below adds the scheme to
        # a Debug build's Info.plist. A tester's build opens crate files through the document types above.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.deckie.booth
        TARGETED_DEVICE_FAMILY: "2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    postBuildScripts:
      - name: Debug only, the deck:// scheme for the test hooks
        shell: /bin/sh
        basedOnDependencyAnalysis: false
        # The processed Info.plist as its input, so it runs after the build writes it (and before signing).
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          set -e
          [ "$CONFIGURATION" = "Debug" ] || exit 0
          P="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          B=/usr/libexec/PlistBuddy
          $B -c "Delete :CFBundleURLTypes" "$P" 2>/dev/null || true
          $B -c "Add :CFBundleURLTypes array" "$P"
          $B -c "Add :CFBundleURLTypes:0 dict" "$P"
          $B -c "Add :CFBundleURLTypes:0:CFBundleURLName string io.deckie.booth" "$P"
          $B -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$P"
          $B -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string deck" "$P"
    scheme:
      testTargets: [DeckTests]
  DeckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: DeckTests
    dependencies:
      - target: Deck
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: io.deckie.booth.tests
        TARGETED_DEVICE_FAMILY: "2"
